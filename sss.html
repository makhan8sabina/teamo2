<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>java</title>
</head>
<body>
    <h1>Practice Tasks</h1>
    <button onclick="task1()">Click</button>
    <button onclick="task2()">Second task</button>
    <button onclick="task3()">Third task</button>
    <button onclick="task3b()">Third task (B) </button>
    <button onclick="task4()">4th task</button>
    <button onclick="task5()">5th task</button>
    <button onclick="task6()">6th task</button>
    <button onclick="task7()">7th task</button>
    <button onclick="task8()">8th task</button>

    <script>
        function task1() {
            const name = prompt("Enter your name:");
            if (name === null) return;
            alert(`Good morning, ${name}!`);
        }

        function task2(){
            const age=Number(prompt("Enter your age: "));
            if (age>=18){
                alert("You are eligible to vote");
            } else {
                alert("Sorry< you are not eligible to vote");
            }
        }

        function task3(){
            const f=Number(prompt("Enter temperature in Fahrenheit:"));
            const c=(f-32)*5/9;
            alert(`The temperature in Celsius is ${c.toFixed(2)}°C.`);
        }
        
        function task3b(){
            const n=Number(prompt("enter value in inches: "));
            const a=n*2.54;
            alert("The length in centimeters is" + a);
        }

        function task4(){
            const p=Number(prompt("enter 1st price: "));
            const s=Number(prompt("enter 2nd price: "));
            const g=Number(prompt("enter 3rd price: "));
            const t=(p+s+g)/100*12+(p+s+g);
            alert(`our total order price with tax is ${t.toFixed(2)}`);
        }

        function task5(){
            const code = Math.floor(Math.random()*9000)+1000;
            alert(`Your coupon code is: ${code}`);
        }

        function task6(){
            const username = prompt("Enter your username:");
            const login = Number(prompt("Enter your login:"));
            if (username==="admin" && login===12345){
                alert("Login successful!");
            } else {
                alert("Invalid username or password.");
            }
        }

        function task7(){
            const numb=Math.floor(Math.random()*100+1);
            const guess=Number(prompt("guess to the generated number between  1 and 100: "));
            if (numb===guess){
                alert("Correct! You guessed the number!");
            } if (guess>numb){
                alert("Too high!");
            } else{
                alert("Too low!")
            }
        }

        function task8(){
            const passw=prompt("Enter a password: ");
            if (passw===null) return;
            const length= passw.length >= 8 && passw.length <= 32;
            const special = /[^A-Za-z0-9]/.test(passw);
            const hasnummber = /[0-9]/.test(passw);
            const hasup = /[A-Z]/.test(passw);
            if (length && special && hasnumber && hasup) {
                alert("Strong password.");
            } else {
                alert("Weak password.");
            }
        }
</script>
</body>
</html>
